# ── Google Cloud Build CI/CD 파이프라인 ─────────────────────────────────────────
# 트리거: GitHub master 브랜치 push → 자동 빌드 & Cloud Run 배포

steps:
  # Step 1: Docker 이미지 빌드
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/hypertrophy-routine:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/hypertrophy-routine:latest'
      - '.'

  # Step 2: Container Registry에 Push
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'gcr.io/$PROJECT_ID/hypertrophy-routine'

  # Step 3: Cloud Run 배포
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'hypertrophy-routine'
      - '--image=gcr.io/$PROJECT_ID/hypertrophy-routine:$COMMIT_SHA'
      - '--region=asia-northeast3'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=256Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'

images:
  - 'gcr.io/$PROJECT_ID/hypertrophy-routine:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/hypertrophy-routine:latest'

options:
  logging: CLOUD_LOGGING_ONLY
