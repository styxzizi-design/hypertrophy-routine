<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="title">근비대 루틴 생성기</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <div class="header-controls">
        <div class="lang-switcher">
          <button class="lang-btn active" data-lang="ko">한</button>
          <button class="lang-btn" data-lang="en">EN</button>
          <button class="lang-btn" data-lang="zh">中</button>
          <button class="lang-btn" data-lang="ja">日</button>
        </div>
        <button id="themeToggle" class="theme-toggle">🌙</button>
      </div>
      <h1 data-i18n="title">💪 근비대 루틴 생성기</h1>
      <p class="subtitle" data-i18n="subtitle">AI가 나에게 맞는 근비대 운동 루틴을 짜드립니다</p>
    </header>

    <form id="routineForm">
      <div class="form-section">
        <label class="section-title" data-i18n="level">운동 경력</label>
        <div class="radio-group">
          <label class="radio-card">
            <input type="radio" name="level" value="초급" checked />
            <span class="radio-label">
              <strong data-i18n="beginner">초급</strong>
              <small data-i18n="beginnerDesc">운동 시작한 지 1년 미만</small>
            </span>
          </label>
          <label class="radio-card">
            <input type="radio" name="level" value="중급" />
            <span class="radio-label">
              <strong data-i18n="intermediate">중급</strong>
              <small data-i18n="intermediateDesc">1~3년 꾸준히 운동</small>
            </span>
          </label>
          <label class="radio-card">
            <input type="radio" name="level" value="고급" />
            <span class="radio-label">
              <strong data-i18n="advanced">고급</strong>
              <small data-i18n="advancedDesc">3년 이상 체계적 훈련</small>
            </span>
          </label>
        </div>
      </div>

      <div class="form-section">
        <label class="section-title" data-i18n="days">주간 운동 일수</label>
        <div class="slider-wrapper">
          <input type="range" id="daysSlider" min="2" max="6" value="4" class="slider" />
          <div class="slider-labels">
            <span>2</span><span>3</span><span>4</span><span>5</span><span>6</span>
          </div>
          <p class="slider-value" id="sliderDisplay"></p>
        </div>
      </div>

      <div class="form-section">
        <label class="section-title">
          <span data-i18n="targetLabel">목표 부위</span><small data-i18n="targetHint"> (복수 선택 가능)</small>
        </label>
        <div class="checkbox-group">
          <label class="checkbox-card">
            <input type="checkbox" name="target" value="가슴" checked />
            <span data-i18n="muscle_chest">가슴</span>
          </label>
          <label class="checkbox-card">
            <input type="checkbox" name="target" value="등" checked />
            <span data-i18n="muscle_back">등</span>
          </label>
          <label class="checkbox-card">
            <input type="checkbox" name="target" value="하체" checked />
            <span data-i18n="muscle_legs">하체</span>
          </label>
          <label class="checkbox-card">
            <input type="checkbox" name="target" value="어깨" />
            <span data-i18n="muscle_shoulders">어깨</span>
          </label>
          <label class="checkbox-card">
            <input type="checkbox" name="target" value="팔" />
            <span data-i18n="muscle_arms">팔</span>
          </label>
          <label class="checkbox-card">
            <input type="checkbox" name="target" value="복근" />
            <span data-i18n="muscle_abs">복근</span>
          </label>
        </div>
      </div>

      <div class="form-section">
        <label class="section-title" data-i18n="equipment">사용 가능 장비</label>
        <div class="radio-group">
          <label class="radio-card">
            <input type="radio" name="equipment" value="헬스장" checked />
            <span class="radio-label">
              <strong data-i18n="gym">헬스장</strong>
              <small data-i18n="gymDesc">바벨, 덤벨, 머신 모두</small>
            </span>
          </label>
          <label class="radio-card">
            <input type="radio" name="equipment" value="홈짐" />
            <span class="radio-label">
              <strong data-i18n="homegym">홈짐</strong>
              <small data-i18n="homegymDesc">덤벨, 바벨, 풀업바</small>
            </span>
          </label>
          <label class="radio-card">
            <input type="radio" name="equipment" value="맨몸" />
            <span class="radio-label">
              <strong data-i18n="bodyweight">맨몸</strong>
              <small data-i18n="bodyweightDesc">장비 없이 자체 중량</small>
            </span>
          </label>
        </div>
      </div>

      <button type="submit" class="generate-btn" data-i18n="generate">
        루틴 생성하기
      </button>
    </form>

    <div id="result" class="result hidden"></div>
  </div>

  <!-- Exercise GIF Modal -->
  <div id="exModal" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="modalTitle"></h3>
        <button id="modalClose" class="modal-close" aria-label="닫기">✕</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
